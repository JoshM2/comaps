name: Build APK
on:
  workflow_dispatch: # Manual trigger
    inputs:
      flavor:
        description: App flavor
        type: choice
        default: Web
        options:
          - Web
          - Fdroid
          - Google  # Needs google-services.json, also downloads the World maps
          - Huawei
      buildType:
        description: Build type
        type: choice
        default: Debug
        options:
          - Debug
          - Beta     # Falls back to debug signing keys without secure.properties.test
          - Release  # Falls back to debug signing keys without secure.properties.release
      arch:
        description: Target ABI
        type: choice
        default: arm64
        options:
          - arm64   # arm64-v8a, virtually every phone from the last decade
          - arm32   # armeabi-v7a
          - x86_64  # Emulators, Chromebooks
          - all     # arm32 + arm64 + x86_64, roughly 3x the build time

env:
  SKIP_MAP_DOWNLOAD: true

jobs:
  apk:
    name: ${{ inputs.flavor }}${{ inputs.buildType }} (${{ inputs.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Free up disk space
        shell: bash
        run: |
          # The native build needs a lot of room, these are not used here.
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/ghc
          df -h /

      - name: Install build tools and dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build \
          qt6-base-dev \
          qt6-declarative-dev \
          qt6-positioning-dev \
          libqt6svg6-dev \
          optipng \
          libfreetype-dev \
          libharfbuzz-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          python3-pip \
          python3-venv \
          zlib1g-dev
          pip install "protobuf<3.21" --break-system-packages

      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 200 # enough to get all commits for the current day

      - name: Parallel submodules checkout
        shell: bash
        run: git submodule update --depth 1 --init --recursive --jobs=$(($(nproc) * 20))

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21 # Java 21 is required for Android Gradle 8 plugin
          cache: gradle

      - name: Configure ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.workflow }}-${{ inputs.flavor }}${{ inputs.buildType }}-${{ inputs.arch }}
          max-size: 2G

      - name: Build ${{ inputs.flavor }}${{ inputs.buildType }}
        shell: bash
        working-directory: android
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          # No -P flag means all of arm32 + arm64 + x86_64, see android/sdk/build.gradle.
          ARCH_FLAG=""
          if [ "${{ inputs.arch }}" != "all" ]; then
            ARCH_FLAG="-P${{ inputs.arch }}"
          fi
          # gradle runs ../configure.sh itself, no need to do it here.
          ./gradlew $ARCH_FLAG assemble${{ inputs.flavor }}${{ inputs.buildType }}

      - name: Summarize built APKs
        if: success()
        shell: bash
        run: |
          {
            echo "### ${{ inputs.flavor }}${{ inputs.buildType }} (${{ inputs.arch }})"
            echo
            find android/app/build/outputs/apk -name '*.apk' -printf '- `%f` (%kK)\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: CoMaps-${{ inputs.flavor }}${{ inputs.buildType }}-${{ inputs.arch }}-${{ github.sha }}
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
