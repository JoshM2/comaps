name: Android CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'
        # Tells the cache runner where to find the build.gradle file
        cache-dependency-path: 'android/build.gradle' 

    # Fix: Looks for gradlew inside the android folder
    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew
      working-directory: ./android

    # Fix: Runs the build task inside the android folder
    - name: Build Debug APK
      run: ./gradlew assembleDebug
      working-directory: ./android

    # Fix: Updates the path to look inside the android subfolder
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
