name: Android CI Build

# Triggers the workflow on push or pull request events for the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out your repository code so the runner can access it
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Set up Java JDK (Android requires Java; match this to your project version)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu' # A reliable, widely used Java distribution
        java-version: '17'
        cache: 'gradle'      # Caches Gradle dependencies to speed up future builds

    # Step 3: Grant execute permission to the Gradle wrapper script
    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    # Step 4: Run the Gradle assembleDebug build task
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # Step 5: Upload the generated APK file so you can download it from GitHub
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
